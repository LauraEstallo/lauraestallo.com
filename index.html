<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laura Estallo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --le-tinta: #14282A;
      --le-hueso: #F7FAF9;
      --le-azul:  #2E6F78;
      --le-display: 'Bebas Neue', sans-serif;
      --le-text: 'Montserrat', sans-serif;
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: var(--le-text); font-weight: 300; line-height: 1.7; background: var(--le-hueso); color: var(--le-tinta); }
    main { text-align: center; padding: 2rem; }
    h1 { font-family: var(--le-display); font-weight: 400; font-size: clamp(44px, 9vw, 72px); line-height: 0.9; letter-spacing: 0.02em; text-transform: uppercase; margin: 0 0 1rem; }
    p { font-weight: 600; font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--le-azul); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Laura Estallo</h1>
    <p>Próximamente</p>
  </main>
</body>
</html>
